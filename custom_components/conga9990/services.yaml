manual_move:
  target:
    entity:
      integration: conga9990
      domain: vacuum
  fields:
    direction:
      required: true
      selector:
        select:
          options:
          - forward
          - backward
          - turn_left
          - turn_right
          - right_forward
          - left_forward
    duration:
      default: 0.3
      selector:
        number:
          min: 0.1
          max: 1
          step: 0.1
          unit_of_measurement: s
manual_stop:
  target:
    entity:
      integration: conga9990
      domain: vacuum
clean_home:
  target:
    entity:
      integration: conga9990
      domain: vacuum
clean_rooms:
  target:
    entity:
      integration: conga9990
      domain: vacuum
  fields:
    room_ids:
      required: true
      selector:
        object: null
    repeats:
      default: 1
      selector:
        number:
          min: 1
          max: 3
clean_spot:
  target:
    entity:
      integration: conga9990
      domain: vacuum
  fields:
    x:
      required: true
      selector:
        number:
          min: 0
          max: 4095
          mode: box
    y:
      required: true
      selector:
        number:
          min: 0
          max: 4095
          mode: box
    map_id:
      required: true
      selector:
        number:
          min: 0
          max: 65535
          mode: box
clean_zones:
  target:
    entity:
      integration: conga9990
      domain: vacuum
  fields:
    zones:
      required: true
      selector:
        object: null
    map_id:
      required: true
      selector:
        number:
          min: 0
          max: 65535
          mode: box
    repeats:
      default: 1
      selector:
        number:
          min: 1
          max: 3
save_profile:
  target:
    entity:
      integration: conga9990
      domain: vacuum
  fields:
    name:
      required: true
      selector:
        text: null
    room_ids:
      selector:
        object: null
    zones:
      selector:
        object: null
    repeats:
      default: 1
      selector:
        number:
          min: 1
          max: 3
    fan_speed:
      default: normal
      selector:
        select:
          options:
          - close
          - gentle
          - normal
          - strong
    clean_pattern:
      default: auto
      selector:
        select:
          options:
          - auto
          - thorough
          - border
          - scrub
          - spiral
          - square_spiral
          - quiet
    water_level:
      default: close
      selector:
        select:
          options:
          - close
          - low
          - middle
          - high
    carpet_boost:
      default: false
      selector:
        boolean: {}
    y_mop:
      default: false
      selector:
        boolean: {}
run_profile:
  target:
    entity:
      integration: conga9990
      domain: vacuum
  fields:
    name:
      required: true
      selector:
        text: null
delete_profile:
  target:
    entity:
      integration: conga9990
      domain: vacuum
  fields:
    name:
      required: true
      selector:
        text: null
